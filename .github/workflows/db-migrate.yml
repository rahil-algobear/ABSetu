name: DB Migrate (production)

# Runs Alembic migrations against the production RDS database whenever
# schema changes land on the release/prod branch. Vercel handles the
# frontend/backend deploy separately via its git integration; this job
# owns the database schema so migrations aren't coupled to the build.
on:
  push:
    branches:
      - release/prod
    paths:
      - "backend/migrations/**"
      - "backend/requirements.txt"
      - ".github/workflows/db-migrate.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Never run two migration jobs at once against the same DB.
concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show current + pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Current DB revision:"
          alembic current
          echo "Migration history:"
          alembic history --verbose | head -n 40

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
